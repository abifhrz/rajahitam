<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Halaman Tidak Ditemukan | Portofolio Abi Fahrezi</title>
  <meta name="description" content="Halaman tidak ditemukan. Kembali ke beranda portofolio Abi Fahrezi." />
  <link rel="icon" href="content/logo.png" type="image/png" />
  <meta name="theme-color" content="#2c2b2b" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"/>

  <link href="css/style.css" rel="stylesheet" />
  <style>
    .error-page {
      min-height: 100vh;
      background-color: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    .error-code {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .error-page h1 {
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .error-page p {
      color: rgba(255, 255, 255, 0.65);
    }

    .error-page .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.6rem 1.6rem;
      border-radius: 99px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      transition: filter 0.2s ease, transform 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-back:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="container">
      <div class="error-code">404</div>
      <h2>Halaman Tidak Ditemukan</h2>
      <p>Waduh, halaman yang kamu cari nggak ada di sini.</p>
      <a class="btn-back" href="./">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 13V3M3.5 7.5L8 3L12.5 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
        </svg>
        Kembali ke Home
      </a>
    </div>
  </main>
</body>
</html>
